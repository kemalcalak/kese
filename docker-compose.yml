name: kese

services:
  postgres:
    image: postgres:17
    container_name: kese-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KESE_PG_USER:-kese}
      POSTGRES_PASSWORD: ${KESE_PG_PASSWORD:-kese}
      POSTGRES_DB: ${KESE_PG_DB:-kese}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Loopback only, and 5433 because kortex's own database holds 5432.
      - "127.0.0.1:${KESE_PG_PORT:-5433}:5432"
    volumes:
      - kese-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KESE_PG_USER:-kese}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${KESE_API_IMAGE:-ghcr.io/kemalcalak/kese:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KESE_ENV: ${KESE_ENV:-local}
      KESE_JWT_SECRET: ${KESE_JWT_SECRET:-}
      KESE_DATABASE_URL: ${KESE_DATABASE_URL:-postgresql+asyncpg://kese:kese@postgres:5432/kese}
      KESE_LOGIN_RATE_LIMIT: ${KESE_LOGIN_RATE_LIMIT:-10/minute}
    ports:
      - "${KESE_API_PORT:-8000}:8000"

volumes:
  kese-pgdata:
